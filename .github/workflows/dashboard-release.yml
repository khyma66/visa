name: Release isolated VisaThreads owner dashboard

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact merged dashboard branch commit (40-character SHA)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: visaflow-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/release/dashboard-production-20261016' && inputs.candidate_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      DASHBOARD_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      ASSISTANT_PROVIDER: 'groq'
      ASSISTANT_ENABLED: 'true'
      ASSISTANT_COMMUNITIES_ENABLED: 'false'
      ASSISTANT_CATCHUP_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prove exact merged dashboard scope before installing or using credentials
        run: node scripts/dashboard-release.mjs check-source
      - run: npm ci
      - run: npm run check:secrets && npm test && npm run typecheck
      - run: node --test scripts/test-dashboard-release.mjs scripts/test-analytics.mjs scripts/test-search-visibility.mjs
      - run: npm audit --audit-level=high
      - name: Capture unchanged live archive, runtime and stopped schedules
        run: node scripts/dashboard-release.mjs capture
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_7QnSRDvWRYFIqA3zhsNIsw_iWSspCTN' }}
      - name: Evaluate unchanged Groq assistant with all existing release cases
        id: evaluate
        run: node scripts/evaluate-groq-assistant.mjs --release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build the exact dashboard candidate
        run: node scripts/dashboard-release.mjs build
      - name: Require fresh model acceptance, unchanged live baseline and stopped schedules
        run: node scripts/dashboard-release.mjs deploy-check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy checked dashboard build
        id: deploy
        run: |
          rm -f .cache/visaflow/live-preview/wrangler-deploy.ndjson
          npx --no-install vinext-cloudflare deploy --config dist/server/wrangler.json --skip-build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ github.workspace }}/.cache/visaflow/live-preview/wrangler-deploy.ndjson
      - name: Record exact uploaded version independently of deploy exit status
        if: always() && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure')
        run: node scripts/production-feature-release.mjs record-deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify source, archive, feature preservation and dashboard privacy
        run: node scripts/smoke-production-features.mjs && node scripts/smoke-dashboard-release.mjs
      - name: Verify runtime settings and schedules remain unchanged after deployment
        run: node scripts/dashboard-release.mjs verify-runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Restore captured version only if this deployment fails verification
        if: failure() && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ROLLBACK_VERSION=$(node scripts/production-feature-release.mjs rollback-version)
          npx --no-install wrangler rollback "$ROLLBACK_VERSION" --name visaflow-dev --config dist/server/wrangler.json --message "Restore captured version after failed dashboard verification"
      - name: Preserve release evidence without user data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-dashboard-evidence-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .cache/visaflow/live-preview/dashboard-scope.json
            .cache/visaflow/live-preview/build-provenance.json
            .cache/visaflow/assistant-acceptance.json
            .cache/visaflow/live-preview/rollout-verification.json
            .cache/visaflow/live-preview/dashboard-verification.json
          include-hidden-files: true
          if-no-files-found: warn
      - name: Restore isolated evaluation routing
        if: always() && (steps.evaluate.outcome == 'success' || steps.evaluate.outcome == 'failure')
        run: node scripts/evaluate-groq-assistant.mjs --cleanup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Remove recovered content
        if: always()
        run: rm -f src/data/api-archive.json .cache/visaflow/live-preview/public-build-values.json

# Manual dispatch only. No schedules or public-launch approval are enabled.
# The reviewed additive database migration is applied and verified separately.
# A passing anonymous smoke check is not real-owner acceptance.

name: Reviewed public release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visaflow-production
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run check:release
      - run: npm test && npm run typecheck
      - run: npm audit --audit-level=high
      - run: npm run build:prod
      - name: Deploy reviewed production build
        run: node_modules/.bin/vinext-cloudflare deploy --config dist/server/wrangler.json --skip-build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check deployed routes and headers
        run: node scripts/smoke-site.mjs "$NEXT_PUBLIC_SITE_URL"

name: Web checks

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run check
      - name: Preserve checked build provenance
        uses: actions/upload-artifact@v4
        with:
          name: checked-build-provenance-${{ github.sha }}
          path: .cache/visaflow/build-provenance.json
          include-hidden-files: true
          if-no-files-found: error
      - run: npm audit --audit-level=high

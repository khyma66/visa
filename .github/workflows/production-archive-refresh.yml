name: Refresh published Apify archive

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visaflow-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      ASSISTANT_PROVIDER: ''
      ASSISTANT_ENABLED: 'false'
      ASSISTANT_COMMUNITIES_ENABLED: 'false'
      ASSISTANT_CATCHUP_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:secrets && npm test && npm run typecheck
      - run: node --test scripts/test-production-feature-release.mjs scripts/test-production-archive-refresh.mjs
      - run: npm audit --audit-level=high
      - name: Capture exact live content and rollback version
        run: node scripts/production-feature-release.mjs capture
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_7QnSRDvWRYFIqA3zhsNIsw_iWSspCTN' }}
      - name: Export only existing successful Apify runs and verify an additive refresh
        run: npm run archive:refresh && node scripts/production-archive-refresh.mjs prepare
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - name: Build checked candidate with the additive archive
        run: node scripts/production-feature-release.mjs build
      - name: Require model acceptance and unchanged live deployment
        run: node scripts/production-feature-release.mjs deploy-check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy checked production content build
        id: deploy
        run: |
          rm -f .cache/visaflow/live-preview/wrangler-deploy.ndjson
          npx --no-install vinext-cloudflare deploy --config dist/server/wrangler.json --skip-build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ github.workspace }}/.cache/visaflow/live-preview/wrangler-deploy.ndjson
      - name: Record exact uploaded version even if deploy exits with an error
        if: always() && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure')
        run: node scripts/production-feature-release.mjs record-deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify source, new archive, assistant, assets and authorization
        run: node scripts/smoke-production-features.mjs
      - name: Restore captured Worker version if verification fails
        if: failure() && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure')
        run: |
          ROLLBACK_VERSION=$(node scripts/production-feature-release.mjs rollback-version)
          npx --no-install wrangler rollback "$ROLLBACK_VERSION" --name visaflow-dev --config dist/server/wrangler.json --message "Restore captured version after failed archive refresh verification" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Preserve metadata-only release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-refresh-evidence-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .cache/visaflow/live-preview/build-provenance.json
            .cache/visaflow/live-preview/rollout-verification.json
          include-hidden-files: true
          if-no-files-found: warn
      - name: Remove recovered and exported content from the runner
        if: always()
        run: rm -f src/data/api-archive.json .cache/visaflow/live-preview/public-build-values.json

  sync-development:
    needs: release
    if: github.ref == 'refs/heads/main' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: visa-central-development
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test scripts/test-development-sync.mjs
      - name: Capture existing isolated dev content after checking production source
        id: capture
        run: node scripts/development-sync.mjs capture
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEV_SUPABASE_PUBLISHABLE_KEY: sb_publishable_iTiFgVvvFA6h9cYqMivsFA_3qnCzmX7
      - name: Build the same source against the isolated development database
        run: node scripts/development-sync.mjs build
      - name: Recheck production source and unchanged dev archive
        run: node scripts/development-sync.mjs deploy-check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy only the checked dev Worker
        id: deploy
        run: npx --no-install vinext-cloudflare deploy --config dist/server/wrangler.json --skip-build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ github.workspace }}/.cache/visaflow/development-sync/wrangler-deploy.ndjson
      - name: Record exact uploaded dev version
        if: always() && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure')
        run: node scripts/development-sync.mjs record-deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify isolated dev source and unchanged dev content
        run: node scripts/development-sync.mjs verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Restore captured dev version only if this upload is still active
        id: rollback
        if: failure() && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure')
        run: |
          ROLLBACK_VERSION=$(node scripts/development-sync.mjs rollback-version)
          npx --no-install wrangler rollback "$ROLLBACK_VERSION" --name visathreads-sandbox --config dist/server/wrangler.json --message "Restore captured dev version after failed archive sync verification" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify restored dev version
        if: always() && steps.rollback.outcome == 'success'
        run: node scripts/development-sync.mjs verify-rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production was not modified by dev sync
        if: always() && steps.capture.outcome == 'success'
        run: node scripts/development-sync.mjs production-unchanged
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Preserve metadata-only dev sync evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-dev-sync-evidence-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .cache/visaflow/development-sync/build-provenance.json
            .cache/visaflow/development-sync/rollout-verification.json
          include-hidden-files: true
          if-no-files-found: warn
      - name: Remove recovered dev content from the runner
        if: always()
        run: rm -f src/data/api-archive.json .cache/visaflow/development-sync/public-build-values.json .cache/visaflow/development-sync/receipt.json

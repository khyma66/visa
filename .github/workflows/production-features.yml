name: Release current VisaThreads AI features
# Gate focused issue synthesis through the real planner and verified repair; add explicit chat export.
# Align question-summary evidence and bounded comparison routing after retained acceptance failures.
# Enforce nonempty planner tasks in the provider schema and preserve clarification precedence.
# Bound concise overview context and enforce shortening after signed-in live tests.
# Require cited unresolved-summary content and preserve whole-answer qualification review.
# Keep multi-discussion summaries concise without turning 101-word useful answers into errors.
# Keep semantic summary interpretations out of legacy literal post-search filtering.
# Enforce the existing brief-summary word contract within the bounded format-repair budget.
# Verify streaming auth denials through the deployed application router, not only the bare Worker.
# Recheck short clarification codes and inherited conversational constraints.
# Require contextual planner acceptance before releasing live progress and generalized follow-ups.
# Publish professional public-facing copy without changing policy receipts or launch permissions.
# Verify summary-first retrieval and same-source-set conversational follow-ups.
# Owner-authorized Google discovery for editorial pages; private/thread indexing remains gated.
# Release task-aware evidence review for questions, summaries and catch-up.
# Both normal and cache-busted health requests must converge before verification.
# Site quality release: shared readable typography and recoverable messaging.
# Keep credential-redacted upload diagnostics when isolated Groq setup fails.
# Use bounded medium-effort evidence review; preserve low-latency generation.
# Keep numbered result references through follow-ups without replaying source text.
# General assistant repair: constrained retrieval, independent cancellation,
# one total deadline, bounded schema recovery and large-discussion acceptance.
# Keep the evaluation manifest in exactly the authenticated readiness order.
# Require atomic source facts and one bounded, independently verified correction.
# Resolve model-selected evidence IDs to server-owned complete source excerpts.
# ROI playbook release: owner launch/experiment workspace and source-linked guides.
# Bound provider collections with nullable slots before exact evidence resolution.
# Verify historical/current document relationships and canonical summary intent.
# Preserve conflicting reports during independent review and correction.
# Accept complete two-source comparisons without requiring duplicate statements.
# Collapse only exact same-discussion, same-time summary repeats before the guarded quality gate.
# Retry only marked transient Supabase Auth timeouts during post-deploy invalid-session smoke.
# Keep repeated-report summaries singular and cited at the material-fact level.
# Require a separate H-4 stamping experience synthesis before releasing the updated assistant.
# Treat documented H-4 visa interviews as useful partial answers without inventing EAD involvement.
# Resolve the common H-4/EAD stamping shorthand consistently for generation and independent review.
# Require the new experience case in the release verifier as well as both evaluator manifests.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/production-features.yml]

permissions:
  contents: read

concurrency:
  group: visaflow-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      ASSISTANT_PROVIDER: 'groq'
      ASSISTANT_ENABLED: 'true'
      ASSISTANT_COMMUNITIES_ENABLED: 'false'
      ASSISTANT_CATCHUP_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:secrets && npm test && npm run typecheck
      - run: node --test scripts/test-production-feature-release.mjs
      - run: npm audit --audit-level=high
      - name: Capture original live archive and active rollback version
        run: node scripts/production-feature-release.mjs capture
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_7QnSRDvWRYFIqA3zhsNIsw_iWSspCTN' }}
      - name: Evaluate hosted chatbot regressions with three independent samples per case
        run: node scripts/evaluate-groq-assistant.mjs --release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build candidate preserving current launch state and existing content
        run: node scripts/production-feature-release.mjs build
      - name: Exercise streamed responses through the fully built application router
        run: node scripts/smoke-assistant-built-stream.mjs
      - name: Require model acceptance and unchanged live baseline
        run: node scripts/production-feature-release.mjs deploy-check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy checked production feature build
        id: deploy
        run: |
          rm -f .cache/visaflow/live-preview/wrangler-deploy.ndjson
          npx --no-install vinext-cloudflare deploy --config dist/server/wrangler.json --skip-build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ github.workspace }}/.cache/visaflow/live-preview/wrangler-deploy.ndjson
      - name: Record exact uploaded version independently of deploy exit status
        if: always() && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure')
        run: node scripts/production-feature-release.mjs record-deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify exact source, unchanged archive, feature availability and auth denials
        run: node scripts/smoke-production-features.mjs
      - name: Restore captured version if this deployment fails verification
        if: failure() && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ROLLBACK_VERSION=$(node scripts/production-feature-release.mjs rollback-version)
          npx --no-install wrangler rollback "$ROLLBACK_VERSION" --name visaflow-dev --config dist/server/wrangler.json --message "Restore captured version after failed AI feature smoke verification"
      - name: Preserve release and model acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-ai-feature-evidence-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .cache/visaflow/live-preview/build-provenance.json
            .cache/visaflow/assistant-acceptance.json
            .cache/visaflow/live-preview/rollout-verification.json
          include-hidden-files: true
          if-no-files-found: warn
      - name: Restore isolated Groq evaluation preview routing
        if: always()
        run: node scripts/evaluate-groq-assistant.mjs --cleanup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Remove recovered content
        if: always()
        run: rm -f src/data/api-archive.json .cache/visaflow/live-preview/public-build-values.json

  sync-development:
    needs: release
    if: github.ref == 'refs/heads/main' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: visa-central-development
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test scripts/test-development-sync.mjs
      - name: Capture only existing dev content after verifying this source is live in production
        id: capture
        run: node scripts/development-sync.mjs capture
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEV_SUPABASE_PUBLISHABLE_KEY: sb_publishable_iTiFgVvvFA6h9cYqMivsFA_3qnCzmX7
      - name: Build the same source for the isolated development database
        run: node scripts/development-sync.mjs build
      - name: Recheck production source and unchanged dev archive before deployment
        run: node scripts/development-sync.mjs deploy-check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy only the checked dev Worker
        id: deploy
        run: npx --no-install vinext-cloudflare deploy --config dist/server/wrangler.json --skip-build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ github.workspace }}/.cache/visaflow/development-sync/wrangler-deploy.ndjson
      - name: Record the exact uploaded dev version even if deployment exits with an error
        if: always() && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure')
        run: node scripts/development-sync.mjs record-deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify exact dev source, preserved content, assets and disabled assistant
        run: node scripts/development-sync.mjs verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Restore captured dev version only if this exact uploaded version is still active
        id: rollback
        if: failure() && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure')
        run: |
          ROLLBACK_VERSION=$(node scripts/development-sync.mjs rollback-version)
          npx --no-install wrangler rollback "$ROLLBACK_VERSION" --name visathreads-sandbox --config dist/server/wrangler.json --message "Restore captured dev version after failed sync verification" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify restored dev version and unchanged content
        if: always() && steps.rollback.outcome == 'success'
        run: node scripts/development-sync.mjs verify-rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production deployment was not modified by dev synchronization
        if: always() && steps.capture.outcome == 'success'
        run: node scripts/development-sync.mjs production-unchanged
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Preserve metadata-only development sync evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-sync-evidence-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .cache/visaflow/development-sync/build-provenance.json
            .cache/visaflow/development-sync/rollout-verification.json
          include-hidden-files: true
          if-no-files-found: warn
      - name: Remove recovered dev content and configuration
        if: always()
        run: rm -f src/data/api-archive.json .cache/visaflow/development-sync/public-build-values.json .cache/visaflow/development-sync/receipt.json

# This updates the already-serving early preview on visathreads.com. It neither
# opens PUBLIC_LAUNCH_APPROVED nor replaces the Reviewed public release workflow.
# Mascot branding release: retain the same full feature checks and production flags.
# Post search refinement: associate delays with stamping rather than unrelated petition timelines.

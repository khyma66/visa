name: Refresh public visa news edition
on:
  schedule:
    # Once a day at 07:23 America/Chicago during standard time (13:23 UTC).
    - cron: '23 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-visa-news-edition
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'khyma66/visa' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Restore the previous public edition when available
        run: |
          if git ls-remote --exit-code origin refs/heads/news-data >/dev/null; then
            git fetch origin refs/heads/news-data:refs/remotes/origin/news-data
            git show FETCH_HEAD:official-news.json > /tmp/official-news.json
            git show FETCH_HEAD:immigration-headlines.json > /tmp/immigration-headlines.json 2>/dev/null || true
          else
            cp src/data/official-news-snapshot.json /tmp/official-news.json
          fi
      - name: Fetch and validate public government notices
        run: node scripts/refresh-news.mjs /tmp/official-news.json
      - name: Fetch attributed U.S. immigration headlines
        run: |
          if ! node scripts/refresh-immigration-headlines.mjs /tmp/immigration-headlines.json; then
            echo 'Publisher index unavailable; retaining the last valid headlines edition, if present.'
          fi
      - name: Publish only the validated edition to the data branch
        run: |
          git config user.name 'VisaThreads News'
          git config user.email 'news-bot@users.noreply.github.com'
          parent=$(git rev-parse --verify refs/remotes/origin/news-data 2>/dev/null || true)
          indexdir=$(mktemp -d)
          export GIT_INDEX_FILE="$indexdir/index"
          if [ -n "$parent" ]; then
            git read-tree "$parent"
          else
            git read-tree --empty
          fi
          blob=$(git hash-object -w /tmp/official-news.json)
          git update-index --add --cacheinfo "100644,$blob,official-news.json"
          if [ -s /tmp/immigration-headlines.json ]; then
            headlines_blob=$(git hash-object -w /tmp/immigration-headlines.json)
            git update-index --add --cacheinfo "100644,$headlines_blob,immigration-headlines.json"
          fi
          # Preserve the independently refreshed, permission-checked publisher edition.
          tree=$(git write-tree)
          if [ -n "$parent" ]; then
            commit=$(printf 'Refresh verified public visa notices\n' | git commit-tree "$tree" -p "$parent")
          else
            commit=$(printf 'Publish verified public visa notices\n' | git commit-tree "$tree")
          fi
          git push origin "$commit:refs/heads/news-data"

name: Read production assistant failure metadata
on:
  workflow_dispatch:
  push:
    branches: [chore/assistant-production-diagnostics-20261015]
    paths:
      - .github/workflows/assistant-production-diagnostics.yml
      - scripts/assistant-production-diagnostics.mjs
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read bounded telemetry without logging request content
        run: node scripts/assistant-production-diagnostics.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

name: Verify deployed development isolation
on:
  workflow_dispatch:
  push:
    branches: [chore/cloudflare-connection-check]
    paths: [.github/workflows/development-verification.yml]
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify with the deployment smoke-test runtime
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {setTimeout} from 'node:timers/promises';
          const origin='https://visa-central.com', expected='85589283d660b88e34ce80be156c95819ab2ed2f';
          const request=(path,options={})=>fetch(origin+path,{redirect:'manual',cache:'no-store',signal:AbortSignal.timeout(20000),...options});
          const response=await request('/api/health');
          assert.equal(response.status,200,'Health status');
          const health=await response.json();
          assert.equal(health.build.gitSha,expected);assert.equal(health.build.dirty,false);
          assert.equal(health.build.siteOrigin,origin);assert.equal(health.releaseStatus,'configured');
          console.log('PASS exact deployed commit and configured build');
          for(const path of ['/','/login','/signup','/ask','/experiences','/experiences/new','/explore','/tags','/news']) {
            const page=await request(path);assert.equal(page.status,200,path);
            assert.match(page.headers.get('x-robots-tag')??'',/noindex/);
            const csp=page.headers.get('content-security-policy')??'';
            assert(csp.includes('https://ppdwysmeistjxzjpmxyk.supabase.co'));
            assert(!csp.includes('cycnichledvqbxevrwnt'));
            assert(!(await page.text()).includes('aria-label="Ask VisaThreads assistant"'));
          }
          console.log('PASS nine regular pages, dev backend CSP and absent AI header');
          assert.equal((await request('/assistant')).status,404);
          let flags;
          for(let i=0;i<10;i++) {
            flags=await request('/api/assistant');
            if(flags.status===200&&flags.headers.get('content-type')?.includes('application/json')) break;
            console.log('Flags endpoint:',flags.status,flags.headers.get('content-type'));
            if(i<9) await setTimeout(5000);
          }
          assert.equal(flags.status,200);assert.match(flags.headers.get('content-type')??'',/application\/json/);
          assert.deepEqual(await flags.json(),{posts:false,communities:false,catchup:false});
          const disabled=await request('/api/assistant',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'ask',scope:{kind:'public'},question:'verification'})});
          assert.equal(disabled.status,503);
          for(const method of ['GET','POST']) assert.equal((await request('/api/communities/00000000-0000-4000-8000-000000000001/summary',{method})).status,503);
          console.log('PASS AI page absent and all assistant endpoints disabled');
          JS

name = "visa-1"
main = "src/index.js"
compatibility_date = "2026-01-22"

compatibility_flags = [
  "nodejs_compat"
]

account_id = "your-cloudflare-account-id"
workers_dev = true

# R2 Bucket
[[r2_buckets]]
binding = "MY_BUCKET"
bucket_name = "data-pipeline"

# KV Namespace
[[kv_namespaces]]
binding = "PROCESSED_KEYS"
id = "5efb3f36000f4319ab0e926229da7b9d"

# Queues
[[queues.producers]]
binding = "PROCESS_QUEUE"
queue = "r2-process-queue"

[[queues.producers]]
binding = "POSTS_QUEUE"
queue = "r2-process-queue"

[[queues.consumers]]
queue = "r2-process-queue"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 5
dead_letter_queue = "r2-process-queue-dlq"

# KV Namespace for Clusters Cache
[[kv_namespaces]]
binding = "POSTS_KV"
id = "5efb3f36000f4319ab0e926229da7b9d"

# Environment
[vars]
SUPABASE_URL = "https://your-project.supabase.co"

# Triggers
[triggers]
crons = ["0 */6 * * *"]

# AI
[ai]
binding = "AI"
